<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChillBites | Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="styles/style.css?v=2.0">
</head>
<body class="bg-light font-['Open_Sans']">

  <!-- Admin Navbar -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="fw-bold fs-4 text-warning">ChillBites Admin</span>
      </a>
      <div class="d-flex gap-3">
        <a href="index.html" class="btn btn-outline-light btn-sm">View Site</a>
        <button class="btn btn-danger btn-sm" onclick="logoutAdmin()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Menu Management</h2>
      <button class="btn btn-primary" type="button" onclick="openAddDishModal()">
        <i data-feather="plus" class="me-2"></i> Add New Dish
      </button>
    </div>

    <!-- Menu Table -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="ps-4">Image</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Status</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
            </thead>
            <tbody id="adminMenuTableBody">
              <!-- Menu items will be populated here via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Menu Modal -->
  <div class="modal fade" id="addMenuModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add New Dish</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="menuForm">
            <input type="hidden" id="dishId">
            <div class="mb-3">
              <label class="form-label">Dish Name</label>
              <input type="text" class="form-control" id="dishName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price (₱)</label>
              <input type="number" class="form-control" id="dishPrice" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="dishDesc" rows="2" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL (or file name in images/)</label>
              <div class="input-group">
                <input type="text" class="form-control" id="dishImage" placeholder="images/sisig.jpg" required>
                <button class="btn btn-outline-secondary" type="button" id="generateImageBtn" onclick="generateRandomImage()">
                  <i data-feather="image"></i> Random
                </button>
              </div>
              <div class="form-text">Click "Random" to fetch a food image from API.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Upload Image (Firebase Storage)</label>
              <input type="file" class="form-control" id="dishImageFile" accept="image/*">
              <div class="form-text">Optional: pick a file and it will upload on Save Dish.</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="dishAvailable" checked>
              <label class="form-check-label" for="dishAvailable">Available for Order</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveDishBtn" onclick="saveDish()">Save Dish</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>feather.replace()</script>
  <script type="module" src="scripts/firebaseUploader.js?v=7"></script>
  <script src="scripts/script.js?v=5.4"></script>
  <script>
    // Initialize Admin Page
    document.addEventListener('DOMContentLoaded', () => {
      // Check for admin access
      const user = JSON.parse(localStorage.getItem('currentUser'));
      if (!user || !user.isAdmin) {
        alert('Access denied. Admin privileges required.');
        window.location.href = 'login.html';
        return;
      }
      
      loadAdminMenu();
    });
  </script>
</body>
</html>
