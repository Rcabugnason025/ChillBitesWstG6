<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChillBites | Order History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="styles/style.css?v=2.0">
</head>
<body class="font-['Open_Sans'] bg-gray-50">
  <header class="bg-danger sticky-top shadow-lg text-white">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a class="d-flex align-items-center text-decoration-none" href="index.html">
        <img src="images/chillbites-logo.jpg" alt="Chillbites logo" class="brand-logo me-2" style="height: 40px;">
        <span class="fw-bold fs-4 text-white">ChillBites</span>
      </a>
      <nav class="d-none d-lg-flex align-items-center gap-4">
        <a href="index.html" class="text-white text-decoration-none hover-scale">Home</a>
        <a href="menu.html" class="text-white text-decoration-none hover-scale">Menu</a>
        <a href="about.html" class="text-white text-decoration-none hover-scale">About</a>
        <a href="contact.html" class="text-white text-decoration-none hover-scale">Contact</a>
        <div class="vr bg-white opacity-50 mx-2"></div>
        <a href="login.html" id="authLinkDesktop" class="btn btn-warning btn-sm fw-bold px-4 rounded-pill text-white">Login</a>
        <a href="#" id="logoutLinkDesktop" class="text-white text-decoration-none d-none">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0">Order History</h2>
      <a class="btn btn-outline-secondary" href="menu.html">Back to Menu</a>
    </div>

    <div id="orderHistoryEmpty" class="alert alert-info d-none">
      No orders found yet. Place an order from the menu to see it here.
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th>Order</th>
                <th>Date</th>
                <th>Type</th>
                <th>Payment</th>
                <th>Items</th>
                <th class="text-end">Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orderHistoryTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="mt-4 text-muted small">
      Need help? <a href="contact.html">Contact us</a> or email <a href="mailto:support@chillbites.com">support@chillbites.com</a>.
    </div>
  </main>

  <footer class="bg-dark text-white py-4 text-center">
    <div class="container">
      <p class="mb-0">© 2025 ChillBites</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>feather.replace()</script>
  <script type="module" src="scripts/firebaseUploader.js?v=7"></script>
  <script src="scripts/script.js?v=5.3"></script>
</body>
</html>
